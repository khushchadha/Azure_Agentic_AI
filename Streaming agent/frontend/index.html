<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Streaming Agent</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app">
  <header>
    <span class="dot"></span>
    <h1>Streaming Agent</h1>
    <span class="sub" id="status">idle</span>
  </header>

  <div id="chat">
    <div class="empty" id="empty">
      <h2>Ask the agent something</h2>
      <div>It hands off to a cook agent or an email agent and streams the reply token by token.</div>
      <div class="chips">
        <span class="chip">give me a recipe for omelette</span>
        <span class="chip">recipe for pasta please</span>
        <span class="chip">send an email to john@test.com about the meeting</span>
      </div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message...  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script src="js/app.js"></script>
</body>
</html>
